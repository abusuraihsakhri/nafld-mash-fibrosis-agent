name: Clinical calculator and legacy regression checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api,test]' build
          python -m pip check
      - name: Set ephemeral test audit key
        run: echo "AUDIT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Test Python workflows
        run: |
          python -m compileall -q agents nafld_mash_fibrosis_agent cli.py mash_sentinel.py enrichment.py
          python -m pytest -q
          python -m build
          nafld-mash-fibrosis-engine fibrosis --age 60 --ast 30 --alt 40 --platelets 250
      - name: Validate browser calculator
        run: |
          node --check web/calculator.js
          node web/test_calculator.cjs
